<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny's Mini Emoji Card Game</title>

<style>
html {
    height: 100%;
    margin: 0;
    padding: 2px;
    box-sizing: border-box;
    background-color: #ff7f00;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100%;
    height: 100%;

    background-color: #000;
    color: #FFA500;
    font-family: sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 25px;
    overflow: hidden;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.rainbowText {
    font-size: 1.6em;
    margin-bottom: 15px;
    white-space: nowrap;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    animation: rainbowText 5s ease-in-out infinite;
}

.dragon {
    display: inline-block;
    animation: glowRGB 3s linear infinite;
}

a {
    text-decoration: none;
    display: flex;
    justify-content: center;
}

button {
    font-size: 1em;
    font-weight: bold;
    padding: 10px 25px;

    background-color: #FFA500;
    color: #000;

    border: none;
    border-radius: 8px;

    cursor: pointer;

    max-width: 250px;
    width: 100%;

    transition: all 0.5s ease;
    box-shadow: 0 0 8px rgba(255,165,0,0.8);
}

button:hover {
    animation: rainbow 5s ease-in-out infinite;
    box-shadow:
        0 0 16px rgba(255,165,0,1),
        0 0 24px rgba(255,165,0,1);
    transform: scale(1.05);
    color: #000;
}

@keyframes glowRGB {
    0%   { text-shadow: 0 0 10px red, 0 0 20px red; }
    16%  { text-shadow: 0 0 10px orange, 0 0 20px orange; }
    32%  { text-shadow: 0 0 10px yellow, 0 0 20px yellow; }
    48%  { text-shadow: 0 0 10px lime, 0 0 20px lime; }
    64%  { text-shadow: 0 0 10px cyan, 0 0 20px cyan; }
    80%  { text-shadow: 0 0 10px violet, 0 0 20px violet; }
    100% { text-shadow: 0 0 10px red, 0 0 20px red; }
}

@keyframes rainbowText {
    0%   { color: #FF0000; }
    16%  { color: #FF7F00; }
    32%  { color: #FFFF00; }
    48%  { color: #00FF00; }
    64%  { color: #0000FF; }
    80%  { color: #4B0082; }
    100% { color: #8B00FF; }
}

@keyframes rainbow {
    0%   { background-color: #FF0000; }
    16%  { background-color: #FF7F00; }
    32%  { background-color: #FFFF00; }
    48%  { background-color: #00FF00; }
    64%  { background-color: #0000FF; }
    80%  { background-color: #4B0082; }
    100% { background-color: #8B00FF; }
}


/* =========================================================
   CURSOR-EFFEKT – REFERENZ 1:1
   ========================================================= */

.glitzer {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 99999;
    width: var(--size);
    height: var(--size);
    opacity: 0;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fffde8 10%,
            var(--color) 28%,
            rgba(255,180,0,.60) 45%,
            transparent 72%
        );
    border-radius: 50%;
    filter:
        drop-shadow(0 0 3px var(--color))
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 12px rgba(255,150,0,.45));
    animation:
        cursorTrail
        var(--duration)
        cubic-bezier(.15,.55,.25,1)
        forwards;
}

.glitzer::before,
.glitzer::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
}

.glitzer::before {
    width: 185%;
    height: 14%;
    background:
        linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );
    border-radius: 999px;
    filter: blur(.3px);
}

.glitzer::after {
    width: 14%;
    height: 185%;
    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );
    border-radius: 999px;
    filter: blur(.3px);
}

.glitzer.long {
    filter:
        drop-shadow(0 0 4px #ffffff)
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 13px var(--color))
        drop-shadow(0 0 19px rgba(255,145,0,.35));
}

.staub {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 99998;
    width: var(--staub-size);
    height: var(--staub-size);
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.72) 0%,
            var(--color) 28%,
            rgba(255,170,0,.42) 55%,
            transparent 100%
        );
    transform: translate(-50%, -50%);
    opacity: 0;
    box-shadow:
        0 0 4px var(--color),
        0 0 9px var(--color),
        0 0 16px rgba(255,150,0,.42),
        0 0 24px rgba(255,170,0,.18);
    animation:
        staubTrail
        var(--duration)
        ease-out
        forwards;
}

.klick-flash {
    position: fixed;
    left: 0;
    top: 0;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 100000;
    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fff6a0 25%,
            #ffd000 50%,
            #ff7800 75%,
            transparent 100%
        );
    box-shadow:
        0 0 5px #fff000,
        0 0 12px #ffad00,
        0 0 22px #ff6500;
    transform:
        translate(-50%, -50%)
        scale(0);
    animation:
        flash .42s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes cursorTrail {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(var(--sx), var(--sy))
            scale(.18);
    }
    10% {
        opacity: .95;
        transform:
            translate(-50%, -50%)
            translate(var(--sx), var(--sy))
            scale(1);
    }
    30% {
        opacity: .85;
        transform:
            translate(-50%, -50%)
            translate(var(--mx), var(--my))
            scale(.9);
    }
    60% {
        opacity: .48;
        transform:
            translate(-50%, -50%)
            translate(var(--ex), var(--ey))
            scale(.55);
    }
    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(var(--ex), var(--ey))
            scale(.08);
    }
}

@keyframes staubTrail {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(.2);
    }
    20% {
        opacity: .8;
        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .25),
                calc(var(--dy) * .25)
            )
            scale(1);
    }
    65% {
        opacity: .55;
        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .65),
                calc(var(--dy) * .65)
            )
            scale(.8);
    }
    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}

@keyframes flash {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0);
    }
    15% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.8);
    }
    45% {
        opacity: .8;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.15);
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {
    .rainbowText {
        font-size: 1.3em;
        gap: 6px;
    }

    button {
        font-size: 0.9em;
        padding: 8px 20px;
    }
}

@media (max-width: 400px) {
    .rainbowText {
        font-size: 1.1em;
        gap: 4px;
    }

    button {
        font-size: 0.8em;
        padding: 6px 16px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="rainbowText">
        <span class="dragon">🐉</span>
        Sunny's Secret Projects
        <span class="dragon">🐉</span>
    </div>

    <div style="display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap;">
        <a href="https://www.sunnysschaetze.de/home/sunnys-secret-project" target="_blank">
            <button>🎴 not available</button>
        </a>
        <a href="https://www.sunnysschaetze.de/home/sunnys-spielecke" target="_blank">
            <button>🎮 Sunny's Spielecke</button>
        </a>
    </div>
</div>


<script>
let letzteX = 0;
let letzteY = 0;
let letzterSpawn = 0;
let aktiveGlitzer = 0;
const MAX_GLITZER = 180;


/* =========================================================
   MOUSE
   ========================================================= */

document.addEventListener(
    "mousemove",
    function(event) {
        erzeugeBewegungsEffekt(
            event.clientX,
            event.clientY
        );
    }
);


/* =========================================================
   TOUCH
   ========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {
        if (!event.touches || !event.touches.length) {
            return;
        }

        const touch = event.touches[0];

        erzeugeBewegungsEffekt(
            touch.clientX,
            touch.clientY
        );
    },
    {
        passive: true
    }
);


/* =========================================================
   CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event) {
        klickEffekt(
            event.clientX,
            event.clientY
        );
    }
);


/* =========================================================
   BEWEGUNGS-EFFEKT
   ========================================================= */

function erzeugeBewegungsEffekt(x, y) {

    const dx = x - letzteX;
    const dy = y - letzteY;

    const entfernung = Math.sqrt(
        dx * dx +
        dy * dy
    );

    const jetzt = performance.now();

    if (entfernung < 2) {
        return;
    }

    if (jetzt - letzterSpawn < 12) {
        letzteX = x;
        letzteY = y;
        return;
    }

    if (aktiveGlitzer >= MAX_GLITZER) {
        letzteX = x;
        letzteY = y;
        return;
    }

    const nx = dx / entfernung;
    const ny = dy / entfernung;

    const trailX = x;
    const trailY = y;

    createGlitzer(
        trailX,
        trailY,
        false,
        nx,
        ny
    );

    createStaub(trailX, trailY);
    createStaub(trailX, trailY);
    createStaub(
        trailX - nx * 6,
        trailY - ny * 6
    );
    createStaub(
        trailX - nx * 12,
        trailY - ny * 12
    );
    createStaub(
        trailX - nx * 25,
        trailY - ny * 25
    );
    createStaub(
        trailX - nx * 40,
        trailY - ny * 40
    );

    if (Math.random() > .68) {
        createGlitzer(
            trailX,
            trailY,
            true,
            nx,
            ny
        );
    }

    if (entfernung > 15) {

        createStaub(
            trailX,
            trailY
        );

        createStaub(
            trailX - nx * 15,
            trailY - ny * 15
        );

        createStaub(
            trailX - nx * 30,
            trailY - ny * 30
        );

        if (entfernung > 28) {

            createStaub(
                trailX - nx * 45,
                trailY - ny * 45
            );

            createStaub(
                trailX - nx * 60,
                trailY - ny * 60
            );
        }
    }

    letzterSpawn = jetzt;

    letzteX = x;
    letzteY = y;
}


/* =========================================================
   GLITZER
   ========================================================= */

function createGlitzer(
    x,
    y,
    grosser = false,
    nx = 0,
    ny = 0
) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el = document.createElement("div");

    el.className = grosser
        ? "glitzer long"
        : "glitzer";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size = grosser
        ? 10 + Math.random() * 5
        : 4 + Math.random() * 4;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--size",
        size + "px"
    );

    const seitlich =
        (Math.random() - .5) * 5;

    const px = -ny;
    const py = nx;

    const sx = px * seitlich;
    const sy = py * seitlich;

    const mx =
        sx -
        nx * (16 + Math.random() * 16);

    const my =
        sy -
        ny * (16 + Math.random() * 16);

    const ex =
        mx -
        nx * (32 + Math.random() * 35) +
        (Math.random() - .5) * 5;

    const ey =
        my -
        ny * (32 + Math.random() * 35) +
        (Math.random() - .5) * 5;

    el.style.setProperty(
        "--sx",
        sx + "px"
    );

    el.style.setProperty(
        "--sy",
        sy + "px"
    );

    el.style.setProperty(
        "--mx",
        mx + "px"
    );

    el.style.setProperty(
        "--my",
        my + "px"
    );

    el.style.setProperty(
        "--ex",
        ex + "px"
    );

    el.style.setProperty(
        "--ey",
        ey + "px"
    );

    const duration =
        900 + Math.random() * 550;

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    el.style.left = x + "px";
    el.style.top = y + "px";

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(
        function() {
            el.remove();
            aktiveGlitzer--;
        },
        duration + 60
    );
}


/* =========================================================
   STAUB
   ========================================================= */

function createStaub(x, y) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el = document.createElement("div");

    el.className = "staub";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size =
        1.5 + Math.random() * 2.5;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--staub-size",
        size + "px"
    );

    const startX =
        (Math.random() - .5) * 20;

    const startY =
        (Math.random() - .5) * 20;

    const dx =
        (Math.random() - .5) * 48;

    const dy =
        (Math.random() - .5) * 48;

    el.style.left =
        (x + startX) + "px";

    el.style.top =
        (y + startY) + "px";

    el.style.setProperty(
        "--dx",
        dx + "px"
    );

    el.style.setProperty(
        "--dy",
        dy + "px"
    );

    const duration =
        650 + Math.random() * 550;

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(
        function() {
            el.remove();
            aktiveGlitzer--;
        },
        duration + 60
    );
}


/* =========================================================
   KLICK-EFFEKT
   ========================================================= */

function klickEffekt(x, y) {

    const flash =
        document.createElement("div");

    flash.className =
        "klick-flash";

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    document.body.appendChild(flash);

    for (let i = 0; i < 18; i++) {

        createExplosionsGlitzer(
            x,
            y,
            Math.random() > .65
        );
    }

    for (let i = 0; i < 18; i++) {
        createExplosionStaub(
            x,
            y
        );
    }

    setTimeout(
        function() {
            flash.remove();
        },
        500
    );
}


/* =========================================================
   EXPLOSIONS-GLITZER
   ========================================================= */

function createExplosionsGlitzer(
    x,
    y,
    grosser = false
) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el =
        document.createElement("div");

    el.className =
        grosser
            ? "glitzer long"
            : "glitzer";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size =
        grosser
            ? 13 + Math.random() * 8
            : 7 + Math.random() * 7;

    const winkel =
        Math.random() *
        Math.PI *
        2;

    const distance =
        grosser
            ? 55 + Math.random() * 55
            : 35 + Math.random() * 70;

    const sx =
        (Math.random() - .5) * 6;

    const sy =
        (Math.random() - .5) * 6;

    const mx =
        Math.cos(winkel) *
        distance *
        .45;

    const my =
        Math.sin(winkel) *
        distance *
        .45;

    const ex =
        Math.cos(winkel) *
        distance;

    const ey =
        Math.sin(winkel) *
        distance;

    const duration =
        500 + Math.random() * 350;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--size",
        size + "px"
    );

    el.style.setProperty(
        "--sx",
        sx + "px"
    );

    el.style.setProperty(
        "--sy",
        sy + "px"
    );

    el.style.setProperty(
        "--mx",
        mx + "px"
    );

    el.style.setProperty(
        "--my",
        my + "px"
    );

    el.style.setProperty(
        "--ex",
        ex + "px"
    );

    el.style.setProperty(
        "--ey",
        ey + "px"
    );

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    el.style.left =
        x + "px";

    el.style.top =
        y + "px";

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(
        function() {
            el.remove();
            aktiveGlitzer--;
        },
        duration + 60
    );
}


/* =========================================================
   EXPLOSIONS-STAUB
   ========================================================= */

function createExplosionStaub(x, y) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el =
        document.createElement("div");

    el.className =
        "staub";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size =
        3 + Math.random() * 4;

    const winkel =
        Math.random() *
        Math.PI *
        2;

    const distance =
        35 + Math.random() * 75;

    const dx =
        Math.cos(winkel) *
        distance;

    const dy =
        Math.sin(winkel) *
        distance;

    const duration =
        450 + Math.random() * 400;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--staub-size",
        size + "px"
    );

    el.style.setProperty(
        "--dx",
        dx + "px"
    );

    el.style.setProperty(
        "--dy",
        dy + "px"
    );

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    el.style.left =
        x + "px";

    el.style.top =
        y + "px";

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(
        function() {
            el.remove();
            aktiveGlitzer--;
        },
        duration + 60
    );
}
</script>

</body>
</html>
